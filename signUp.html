<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - GirlyPop</title>
    <link rel="stylesheet" href="css-files/signUp.css">
    <link rel="icon" type="image/svg+xml" href="./images/girlypop-favicon.svg" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.4/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css">
</head>
<body>
<!-- 
    <div class="alert-cont-before">
        <div class="alert-cont">
            <i class="bi bi-x-lg exit-alert"></i>
            <p>Feature coming soon!</p>
        </div>
    </div> -->


    <main>

        <section class="welcome">
            <img src="./images/Founder-img.png" alt="Our-founder">
            <div class="text">
                <p>"Our goal is to create a space where femme presenting people can find their dream style with ease and convenience" - Founder</p>
                <p>Buy and sell femme clothing, closet to closet</p>
            </div>
        </section>

        <section class="form">

            <div class="nav-btns">
                
                <a class="button" href="./signIn.html">
                    Sign In
                </a>
                
                <a class="button" href="./signUp.html">
                    Sign Up
                </a>
                
            </div>

            <div class="names">

                <div class="field">
                    <label for="first-name">First name</label>
                    <input name="first-name" type="text" placeholder="Reyna">
                </div>

                <div class="field">
                    <label for="last-name">Last name</label>
                    <input name="last-name" type="text" placeholder="Cole">
                </div>

            </div>

            <div class="field">
                <label for="email">Email</label>
                <input type="text" name="email" placeholder="you@email.com">
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input type="password" name="password">
            </div>

            <div class="terms">
                <input type="checkbox" name="agree">
                <label for="agree">
                    I agree to GirlyPop's Terms of Service and Privacy Policy, and I confirm I am 18 or older
                </label>
            </div>

            <button type="submit" class="submit">Sign In</button>

            <div class="demacator">
                <span></span>
                <small>Or continue with</small>
                <span></span>
            </div>

            <div class="other-ways">
                
                <button>
                    <i class="hgi hgi-stroke hgi-rounded hgi-google"></i>
                    Google
                </button>
                
                <button>
                    <i class="hgi hgi-stroke hgi-rounded hgi-apple"></i>
                    Apple
                </button>
            
            </div>

            <small class="other-nav">Have an account? 
                <span>
                    <a href="./signIn.html">
                        Sign in
                    </a>
                </span>
            </small>

        </section>
    
    </main>

<script type="module" src="./new-js-files/signUp.js"></script>
</body>
</html>
