<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="./images/girlypop-favicon.svg" />
    <title>Product upload - GirlyPop</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.4/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./css-files/upload.css">
    <link rel="stylesheet" href="./css-files/theme.css">
    <link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css">
</head>

<body>

    <div class="sm-nav">
        
        <div class="sm-nav-cont">
            
            <a href="./home.html">
                <i class="hgi hgi-stroke hgi-rounded hgi-home-09 home"></i>
                Home
            </a>
            
            <a href="./checkout.html">
                <div class="checkout-count">
                    <i class="hgi hgi-stroke hgi-rounded hgi-shopping-basket-01"></i>
                    <div class="counter">0</div>
                </div>
                Checkout
            </a>
        
        </div>

        <div class="sm-profile">
            <a href="./profile.html">
                <div class="profile-border">
                    <div class="profile">
                        <img src="./images/medium-shot-friends-having-fun-party.jpg" alt="">
                    </div>
                </div>
                Your profile
            </a>
        </div>

    </div>

    <header>

        <nav>
            <div class="us-search">
                <a href="./index.html">
                    <img src="./images/Girlypop-logo-pink.png" alt="Our Logo">
                </a>
               
                <div class="search-bar">
                    <i class="hgi hgi-stroke hgi-rounded hgi-search-01"></i>
                    <input type="text" placeholder="Search pieces...">
                </div>
            </div>

            <div class="navigations">
            
                <a href="./home.html">
                    <i class="hgi hgi-stroke hgi-rounded hgi-home-09 home"></i>
                </a>

                <a href="./checkout.html">
                    <div class="checkout-count">
                        <i class="hgi hgi-stroke hgi-rounded hgi-shopping-bag-01"></i>
                        <div class="counter">0</div>
                    </div>
                </a>

                <a href="./profile.html">
                    <div class="profile-border">
                        <div class="profile">
                            <img src="./images/medium-shot-friends-having-fun-party.jpg" alt="">
                        </div>
                    </div>
                </a>
                
            
            </div>

            <i class="hgi burger hgi-stroke hgi-rounded hgi-menu-01"></i>

        </nav>

    </header>


    <main>

        <section class="sect-one">

            <div class="initial-info">
                
                <div class="img-upload">
                    <i class="hgi hgi-stroke hgi-rounded hgi-plus"></i>
                </div>

                <div class="init-info">

                    <div class="field">
                        <label for="product-name">Product name</label>
                        <input type="text" name="product-name">
                    </div>
                
                    <div class="field">
                        <label for="product-size">Product size</label>
                        <select name="product-size">
                            <option value="xs">Size XS</option>
                            <option value="s">Size S</option>
                            <option value="m">Size M</option>
                            <option value="l">Size L</option>
                            <option value="xl">Size XL</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="product-price">Product price</label>
                        <input type="text" name="product-price" placeholder="$0.00">
                    </div>

                </div>

            </div>

            <div class="damages">
                <p>Is product in good shape?</p>
                <div class="yes-no">
                    <span>Yes</span>
                    <span>No</span>
                </div>
                <input type="text" placeholder="Describe damages">
            </div>
        
        </section>
        
        <section class="sect-two">

            <div class="category prod-desc">
                
                <label for="clothing-category">Category</label>
                <select name="clothing-category" id="">
                    <option selected hidden>Choose category</option>
                    <option value="top">Top</option>
                    <option value="bottom">Bottom</option>
                    <option value="dress">Dress</option>
                    <option value="shoes">Shoes</option>
                    <option value="accessory">Accessory</option>
                    <option value="bags">Bags</option>
                </select>
            
            </div>
            
            <div class="tag-input">

                <div class="tag-header">

                    <label for="tag">Tags</label>
                    <small>8 left</small>

                </div>
                
                <div class="tag-body">

                    <input type="text" name="tag" placeholder="eg.whimsy">
                    <i class="hgi hgi-stroke hgi-rounded hgi-arrow-right-02"></i>
                
                </div>
            
                <div class="named-field">

                    <p class="tag">
                        Whimsy
                        <i class="hgi hgi-stroke hgi-rounded hgi-x"></i>
                    </p>
                
                </div>

            </div>
        
            <div class="prod-desc">
                <label for="description">Product description</label>
                <textarea name="description"></textarea>
            </div>

        </section>

        <button type="submit">
            Add to Shop
            <i class="hgi hgi-stroke hgi-rounded hgi-store-add-01"></i>
        </button>

    </main>
    
    <script type="module" src="./new-js-files/upload.js"></script>
</body>
</html>
