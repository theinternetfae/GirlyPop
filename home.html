<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="./images/girlypop-favicon.svg" />
    <title>Your Home - GirlyPop</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.4/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./css-files/home.css">
    <link rel="stylesheet" href="./css-files/theme.css">
    <link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css">
</head>
<body class="the-body">

    <div class="sm-nav">
        
        <div class="sm-nav-cont">
            
            <a href="./home.html">
                <i class="hgi hgi-stroke hgi-rounded hgi-home-09 home"></i>
                Home
            </a>
            
            <a href="./checkout.html">
                <div class="checkout-count">
                    <i class="hgi hgi-stroke hgi-rounded hgi-shopping-basket-01"></i>
                    <div class="counter">0</div>
                </div>
                Checkout
            </a>
        
        </div>

        <div class="sm-profile">
            <a href="./profile.html">
                <div class="profile-border">
                    <div class="profile">
                        <img src="./images/medium-shot-friends-having-fun-party.jpg" alt="">
                    </div>
                </div>
                Your profile
            </a>
        </div>

    </div>


    <header>

        <nav>
            
            <div class="us-search">

                <a href="./index.html">
                    <img src="./images/Girlypop-logo-pink.png" alt="Our Logo">
                </a>
               
                <div class="search-bar">
                    <i class="hgi hgi-stroke hgi-rounded hgi-search-01"></i>
                    <input type="text" placeholder="Search items...">
                </div>
            
            </div>

            <div class="navigations">
            
                <a href="./home.html">
                    <i class="hgi hgi-stroke hgi-rounded hgi-home-09 home"></i>
                </a>

                <a href="./checkout.html">
                    <div class="checkout-count">
                        <i class="hgi hgi-stroke hgi-rounded hgi-shopping-basket-01"></i>
                        <div class="counter">0</div>
                    </div>
                </a>

                <a href="./profile.html">
                    <div class="profile-border">
                        <div class="profile">
                            <img src="./images/medium-shot-friends-having-fun-party.jpg" alt="">
                        </div>
                    </div>
                </a>
                            
            </div>

            <i class="hgi burger hgi-stroke hgi-rounded hgi-menu-01"></i>

        </nav>

    </header>

    <main>
        
        <section class="sect-one">
            <div class="container">
                
                <div class="user-sort">
                    <p>For you</p>
                    <p>New In</p>
                    <p>Following</p>
                </div>

                <div class="cat-select no-scrollbar">
                    <p class="category selected">All</p>
                    <p class="category">Tops</p>
                    <p class="category">Bottoms</p>
                    <p class="category">Dresses</p>
                    <p class="category">Shoes</p>
                    <p class="category">Accessories</p>
                    <p class="category">Bags</p>
                </div>

                <div class="sort">
                    <small class="display-items-count"></small>
                    <select name="sorter" id="sorter" class="date-sorter">
                        <option value="random" selected>Random</option>
                        <option value="newer">Newer</option>
                        <option value="older">Older</option>
                    </select>
                </div>

            </div>
        </section>

        <section class="sect-two">
            
            <div class="product-display">
            
            </div>

        </section>
    
        <section class="full-product-details hidden">


        </section>

    </main>

        
    <footer>
        <img src="./images/Girlypop-logo-grey.png" alt="Our-logo">
        <div class="footer-sect">
        
            <div class="footer-sect-cat">
                <h4>Shop</h4>
                <p>New In</p>
                <p>Categories</p>
                <p>Sellers</p>
            </div>
            
            <div class="footer-sect-cat">
                <h4>Sell</h4>
                <p>Start selling</p>
                <p>Seller fees</p>
                <p>Shipping</p>
            </div>
            
            <div class="footer-sect-cat">
                <h4>Company</h4>
                <p>About</p>
                <p>Community guidelines</p>
                <p>Contact</p>
            </div>
        
        </div>
    </footer>


    <script type="module" src="./new-js-files/homeO.js"></script>
</body>
</html>
