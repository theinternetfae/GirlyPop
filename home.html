<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="./images/girlypop-favicon.svg" />
    <title>Your Home - GirlyPop</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.4/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./css-files/home.css">
    <link rel="stylesheet" href="./css-files/theme.css">
    <link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css">
</head>
<body class="the-body">

    <header>

        <nav>
            <div class="us-search">
                <img src="./images/Girlypop-logo-pink.png" alt="Our Logo">
               
                <div class="search-bar">
                    <i class="hgi hgi-stroke hgi-rounded hgi-search-01"></i>
                    <input type="text" placeholder="Search pieces, sellers, brands">
                </div>
            </div>

            <div class="navigations">
            
                <i class="hgi hgi-stroke hgi-rounded hgi-home-09 home"></i>

                <div class="checkout-count">
                    <i class="hgi hgi-stroke hgi-rounded hgi-shopping-bag-01"></i>
                    <div class="counter">0</div>
                </div>
                
                <div class="profile-border">
                    <div class="profile">
                        <img src="./images/medium-shot-friends-having-fun-party.jpg" alt="">
                    </div>
                </div>
            
            </div>

        </nav>

    </header>

    <main>
        
        <section class="sect-one">
            <div class="container">
                
                <div class="user-sort">
                    <p>For you</p>
                    <p>New In</p>
                    <p>Following</p>
                </div>

                <div class="cat-select">
                    <p>All</p>
                    <p>Tops</p>
                    <p>Bottoms</p>
                    <p>Dresses</p>
                    <p>Shoes</p>
                    <p>Accessories</p>
                    <p>Bags</p>
                </div>

                <div class="sort">
                    <small>128 pieces</small>
                    <select name="sorter" id="sorter">
                        <option value="newest">Newest</option>
                        <option value="older">Older</option>
                        <option value="most liked">Most liked</option>
                    </select>
                </div>

            </div>
        </section>

        <section class="sect-two">
            
        </section>
        
        <section></section>
    </main>

    <script type="module" src="./new-js-files/homeO.js"></script>
</body>
</html>
