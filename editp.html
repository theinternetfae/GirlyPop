<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit profile - GirlyPop</title>
    <link rel="icon" type="image/svg+xml" href="./images/girlypop-favicon.svg" />
    <link rel="stylesheet" href="./css-files/editp.css">
    <link rel="stylesheet" href="./css-files/theme.css">
    <link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css">
</head>
<body>

    <header>

        <nav>
            <div class="us-search">
                <a href="./index.html">
                    <img src="./images/Girlypop-logo-pink.png" alt="Our Logo">
                </a>
               
                <div class="search-bar">
                    <i class="hgi hgi-stroke hgi-rounded hgi-search-01"></i>
                    <input type="text" placeholder="Search pieces, sellers, brands">
                </div>
            </div>

            <div class="navigations">
            
                <a href="./home.html">
                    <i class="hgi hgi-stroke hgi-rounded hgi-home-09 home"></i>
                </a>

                <a href="./checkout.html">
                    <div class="checkout-count">
                        <i class="hgi hgi-stroke hgi-rounded hgi-shopping-bag-01"></i>
                        <div class="counter">0</div>
                    </div>
                </a>

                <a href="./profile.html">
                    <div class="profile-border">
                        <div class="profile">
                            <img src="./images/medium-shot-friends-having-fun-party.jpg" alt="">
                        </div>
                    </div>
                </a>
                
            
            </div>

        </nav>

    </header>

    <main>

        <section class="sect-one">

            <section class="profile-banner">
                <i class="hgi hgi-stroke hgi-rounded hgi-plus"></i>
            </section>
            
            <section class="profile-info">
                
                <div class="pfp-name">
                    <div class="img-border">
                        <div class="img">
                            <i class="hgi hgi-stroke hgi-rounded hgi-plus"></i>
                        </div>
                    </div>
                
                    <div class="name-user">
                        <p>Member since • August 16th, 2026</p>
                    </div>
                </div>
                
                <a href="./profile.html" class="button"> Cancel </a>
            
            </section>        

        </section>
    
    </main>


</body>
</html>
